syntax = "proto3";
package calculator;

service Calculator {
  rpc MultiplyByTwo (MultiplyRequest) returns (MultiplyResponse) {}
  rpc AddNumbers (AddRequest) returns (AddResponse) {}
}

message MultiplyRequest {
  int32 number = 1;
}

message MultiplyResponse {
  int32 result = 1;
}

message AddRequest {
  int32 a = 1;
  int32 b = 2;
}

message AddResponse {
  int32 sum = 1;
}